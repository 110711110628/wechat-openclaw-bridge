<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Windows VM -->
  <rect x="20" y="20" width="860" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="20" width="860" height="34" rx="12" fill="#e2e8f0"/>
  <rect x="20" y="42" width="860" height="12" fill="#e2e8f0"/>
  <text x="40" y="43" font-size="14" font-weight="600" fill="#334155">Windows 虚拟机（常开，微信窗口不可最小化）</text>

  <rect x="60" y="86" width="200" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="160" y="122" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">WeChat 4.x</text>
  <text x="160" y="146" font-size="12" text-anchor="middle" fill="#64748b">真实客户端</text>
  <text x="160" y="166" font-size="12" text-anchor="middle" fill="#64748b">保持登录 / 窗口可见</text>

  <rect x="400" y="80" width="420" height="122" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="610" y="108" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">wxapi · ASP.NET Core :18800</text>
  <text x="420" y="134" font-size="12" fill="#1e40af">/api/status  /api/visible  /api/inbound</text>
  <text x="420" y="156" font-size="12" fill="#1e40af">/api/send  /api/upload/send  /api/shot</text>
  <text x="420" y="178" font-size="12" fill="#1e40af">/api/bubbles  /api/history/deep  /api/group/*</text>
  <text x="420" y="196" font-size="11" fill="#64748b">鉴权：X-Token 头</text>

  <!-- UI automation arrows -->
  <line x1="262" y1="128" x2="396" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="329" y="120" font-size="11" text-anchor="middle" fill="#475569">UI Automation 读</text>
  <line x1="396" y1="166" x2="262" y2="166" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="329" y="182" font-size="11" text-anchor="middle" fill="#475569">SendText / SendFile</text>

  <!-- connector -->
  <line x1="610" y1="204" x2="610" y2="286" stroke="#059669" stroke-width="2" marker-end="url(#arg)"/>
  <text x="620" y="250" font-size="12" fill="#047857">HTTP + X-Token</text>

  <!-- Linux host -->
  <rect x="20" y="290" width="860" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="290" width="860" height="34" rx="12" fill="#d1fae5"/>
  <rect x="20" y="312" width="860" height="12" fill="#d1fae5"/>
  <text x="40" y="313" font-size="14" font-weight="600" fill="#065f46">Linux 主机（OpenClaw 所在机器）</text>

  <rect x="60" y="356" width="250" height="120" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="185" y="384" font-size="15" font-weight="600" text-anchor="middle" fill="#065f46">wxbridge.py</text>
  <text x="76" y="410" font-size="12" fill="#047857">1s 轮询 inbound</text>
  <text x="76" y="430" font-size="12" fill="#047857">分发给对应 agent</text>
  <text x="76" y="450" font-size="12" fill="#047857">回传 out/ 目录文件</text>
  <text x="76" y="468" font-size="12" fill="#047857">watchdog 自动重启 wxapi</text>

  <line x1="312" y1="416" x2="386" y2="416" stroke="#059669" stroke-width="1.6" marker-end="url(#arg)"/>
  <text x="349" y="408" font-size="11" text-anchor="middle" fill="#047857">CLI</text>

  <rect x="390" y="330" width="240" height="86" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="356" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">agent: owner</text>
  <text x="510" y="378" font-size="11.5" text-anchor="middle" fill="#78350f">全工具：可读文件 / 执行命令</text>
  <text x="510" y="398" font-size="11.5" text-anchor="middle" fill="#78350f">仅主人的微信昵称可用</text>

  <rect x="390" y="426" width="240" height="66" rx="10" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="510" y="450" font-size="14" font-weight="600" text-anchor="middle" fill="#075985">agent: chat</text>
  <text x="510" y="472" font-size="11.5" text-anchor="middle" fill="#0c4a6e">write / 联网 / 看图，禁 read+exec</text>

  <rect x="660" y="356" width="200" height="136" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="760" y="382" font-size="14" font-weight="600" text-anchor="middle" fill="#5b21b6">agent: group</text>
  <text x="760" y="404" font-size="11.5" text-anchor="middle" fill="#6d28d9">群聊 @ 触发</text>
  <text x="760" y="424" font-size="11.5" text-anchor="middle" fill="#6d28d9">只读：查询 + 回答</text>
  <text x="760" y="444" font-size="11.5" text-anchor="middle" fill="#6d28d9">禁写文件 / 禁执行</text>
  <text x="760" y="470" font-size="11.5" text-anchor="middle" fill="#6d28d9">上下文：滚动翻页</text>

  <text x="450" y="512" font-size="11" text-anchor="middle" fill="#94a3b8">蓝色＝Windows 侧录制与发送　绿色＝Linux 侧调度　三个 agent 靠 openclaw.json 的 deny 清单隔离权限</text>
</svg>
